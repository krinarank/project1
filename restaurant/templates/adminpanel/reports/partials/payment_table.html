<table class="table table-bordered">
<thead>
<tr>
<th>Payment Method</th>
<th>Total Orders</th>
<th>Total Amount</th>
</tr>
</thead>

<tbody>
{% for p in payments %}
<tr>
<td>{{ p.payment__method }}</td>
<td>{{ p.total_orders }}</td>
<td>₹ {{ p.total_amount }}</td>
</tr>
{% endfor %}
</tbody>
</table>
