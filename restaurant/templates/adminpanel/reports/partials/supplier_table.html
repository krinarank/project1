<table class="table table-bordered table-striped">
    <thead>
        <tr>
            <th>ID</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Contact</th>
            <th>Email</th>
            <th>Address</th>
            <th>Area</th>
        </tr>
    </thead>
    <tbody>
        {% for s in suppliers %}
        <tr>
            <td>{{ s.id }}</td>
            <td>{{ s.fname }}</td>
            <td>{{ s.lname }}</td>
            <td>{{ s.contact_no }}</td>
            <td>{{ s.email }}</td>
            <td>{{ s.address }}</td>
            <td>{{ s.area.name }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="7" class="text-center">No suppliers found</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
