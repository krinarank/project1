<table class="table table-bordered">
    <thead>
        <tr>
            <th>Order ID</th><th>Customer</th><th>Total Qty</th><th>Total Amount</th><th>Status</th><th>Order Date</th>
        </tr>
    </thead>
    <tbody>
        {% for o in orders %}
        <tr>
            <td>{{ o.id }}</td>
            <td>{{ o.user.username }}</td>
            <td>{{ o.total_qty }}</td>
            <td>{{ o.total_amount }}</td>
            <td>{{ o.order_status }}</td>
            <td>{{ o.order_date|date:"Y-m-d H:i" }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
