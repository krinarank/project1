<table class="table table-bordered table-striped">
    <thead>
        <tr>
            <th>ID</th>
            <th>Order ID</th>
            <th>Delivery Person</th>
            <th>Customer</th>
            <th>Status</th>
            <th>Assign Time</th>
        </tr>
    </thead>
    <tbody>
        {% for a in assignments %}
        <tr>
            <td>{{ a.id }}</td>
            <td>{{ a.order.id }}</td>
            <td>{{ a.delivery_person.fname }} {{ a.delivery_person.lname }}</td>
            <td>{{ a.user.firstname }} {{ a.user.lastname }}</td>
            <td>{{ a.status }}</td>
            <td>{{ a.assign_time }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="6" style="text-align:center;">No assignments found</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
