<table class="table table-bordered table-striped">
    <thead>
        <tr>
            <th>ID</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Contact</th>
            <th>Email</th>
            <th>Address</th>
            <th>Joining Date</th>
        </tr>
    </thead>
    <tbody>
        {% for d in delivery_persons %}
        <tr>
            <td>{{ d.id }}</td>
            <td>{{ d.fname }}</td>
            <td>{{ d.lname }}</td>
            <td>{{ d.contact_no }}</td>
            <td>{{ d.email }}</td>
            <td>{{ d.address }}</td>
            <td>{{ d.joining_date }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="7" style="text-align:center;">No delivery persons found</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
