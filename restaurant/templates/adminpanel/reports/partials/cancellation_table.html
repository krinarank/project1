<table class="table table-bordered table-striped">
<thead>
<tr>
    <th>Order ID</th>
    <th>Customer</th>
    <th>Total</th>
    <th>Cancelled Date</th>
</tr>
</thead>
<tbody>
{% for order in orders %}
<tr>
    <td>{{ order.id }}</td>
    <td>{{ order.user.username }}</td>
    <td>{{ order.total_amount }}</td>
    <td>{{ order.order_date }}</td>
</tr>
{% empty %}
<tr><td colspan="4" class="text-center">No Cancelled Orders</td></tr>
{% endfor %}
</tbody>
</table>
