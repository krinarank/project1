{% extends "adminpanel/base.html" %}
{% block content %}

<style>

.report-card{
    background:#fff;
    border-radius:12px;
    padding:18px;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
    position:relative;
}

/* corner filters */
.quick-corner{
    position:absolute;
    top:14px;
    right:18px;
}

.quick-corner .btn{
    padding:4px 10px;
    font-size:13px;
}

/* filter row */
.filter-row{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

/* smaller date boxes */
.date-box{
    width:150px;
    height:34px;
    padding:4px 8px;
    font-size:14px;
}

.report-select{
    width:200px;
}

@media(max-width:768px){
    .filter-row{
        flex-direction:column;
        align-items:flex-start;
    }
    .quick-corner{
        position:static;
        margin-bottom:10px;
    }
}

</style>

<div class="container-fluid mt-3">

</div>

<script>

document.addEventListener("DOMContentLoaded", function(){

    let today = new Date().toISOString().split("T")[0];
    document.getElementById("fromDate").max = today;
    document.getElementById("toDate").max = today;

    // QUICK BUTTONS
    document.querySelectorAll(".quick").forEach(btn=>{
        btn.addEventListener("click",function(){

            let type=this.dataset.type;
            let today=new Date();
            let fromDate="",toDate="";

            if(type==="today"){
                fromDate=today.toISOString().split("T")[0];
                toDate=fromDate;
            }

            if(type==="week"){
                let first=new Date(today.setDate(today.getDate()-today.getDay()));
                let last=new Date();
                fromDate=first.toISOString().split("T")[0];
                toDate=last.toISOString().split("T")[0];
            }

            if(type==="month"){
                let first=new Date(today.getFullYear(),today.getMonth(),1);
                let last=new Date();
                fromDate=first.toISOString().split("T")[0];
                toDate=last.toISOString().split("T")[0];
            }

            document.getElementById("fromDate").value=fromDate;
            document.getElementById("toDate").value=toDate;

        });
    });

});


// SHOW REPORT
document.getElementById("showBtn").addEventListener("click", function(){

    let report = document.getElementById("reportSelector").value;
    let fromDate = document.getElementById("fromDate").value;
    let toDate = document.getElementById("toDate").value;

    if(!fromDate || !toDate){
        alert("Select dates");
        return;
    }

    if(fromDate > toDate){
        alert("Invalid date range");
        return;
    }

    fetch(`/dashboard/reports/load/${report}/?from_date=${fromDate}&to_date=${toDate}`)
    .then(res=>res.text())
    .then(data=>{
        document.getElementById("reportContent").innerHTML=data;
    });

});


// PDF
document.getElementById("downloadPdfBtn").addEventListener("click", function(){

    let report = document.getElementById("reportSelector").value;
    let fromDate = document.getElementById("fromDate").value;
    let toDate = document.getElementById("toDate").value;

    if(!fromDate || !toDate){
        alert("Select dates");
        return;
    }

    if(fromDate > toDate){
        alert("Invalid date range");
        return;
    }

    let type = report.split("_")[0];
    window.open(`/dashboard/reports/pdf/${type}/?from_date=${fromDate}&to_date=${toDate}`);

});

</script>

{% endblock %}
