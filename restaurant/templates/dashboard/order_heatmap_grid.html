{% extends 'adminpanel/base.html' %}
{% block content %}

<h2 style="margin-bottom: 20px;">Ahmedabad Area-wise Orders Treemap</h2>

<div id="treemap" style="width: 100%; height: 600px;"></div>

<!-- Modal -->
<div id="orderModal" 
     style="display:none; position:fixed; top:0; left:0; 
            width:100%; height:100%; 
            background:rgba(0,0,0,0.5); 
            justify-content:center; align-items:center; z-index:9999;">

    <div style="
    background:white;
    width:100%;
    max-width:900px;
    max-height:85%;
    overflow:auto;
    border-radius:12px;
    padding:25px;
    box-shadow:0 8px 30px rgba(0,0,0,0.25);
    position:relative;
">

        <span id="closeModal" 
              style="position:absolute; right:15px; top:10px; 
                     cursor:pointer; font-size:20px;">✖</span>

        <div id="modalContent"></div>
    </div>
</div>

{{ labels|json_script:"labels-data" }}
{{ values|json_script:"values-data" }}
{{ ids|json_script:"ids-data" }}
{{ area_order_details|json_script:"details-data" }}

<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>




<script>

var modalOpen = false;

var labels = JSON.parse(document.getElementById('labels-data').textContent);
var values = JSON.parse(document.getElementById('values-data').textContent);
var ids = JSON.parse(document.getElementById('ids-data').textContent);
var details = JSON.parse(document.getElementById('details-data').textContent);

var customdata = ids.map(id => details[id] || []);

var colors = labels.map((_, i) => 
    ['#FF3F4F','#FF9F1C','#2EC4B6','#E71D36','#011627',
     '#FFBF69','#6A0572','#FF6B6B','#4CC9F0','#8338EC'][i % 10]
);

// ✅ TREEMAP DATA
var data = [{
    type: "treemap",
    labels: labels,
    parents: Array(labels.length).fill(""),
    values: values,
    branchvalues: "total",
    root: { color: "white" },
    customdata: customdata,
    branchvalues: "total",
    maxdepth: 1,              // 🔥 ZOOM STOP
    pathbar: { visible: false },
    hoverinfo: "label+value",
    textposition:'middle center',
    textinfo: "label",
    insidetextfont: {
        size: 16,
        color: "white",
        
    },
    marker: { 
        colors: colors,
        line: { width: 2, color: "white" }
    }
}];

// ✅ LAYOUT
var layout = {
    margin: { t: 50, l: 25, r: 25, b: 25 },
    paper_bgcolor: "#f9f9f9",
    dragmode: false,
    uirevision: "locked"
};

// ✅ CREATE PLOT
Plotly.newPlot('treemap', data, layout, {
    displayModeBar: false,
    scrollZoom: false,
    responsive: true
});

var treemap = document.getElementById('treemap');

// ✅ TREEMAP CLICK EVENT (NO ZOOM)
treemap.on('plotly_treemapclick', function(e){

    if(!e.points || e.points.length === 0) return false;

    var point = e.points[0];
    var areaOrders = point.customdata || [];

    var html = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <div>
                <h2 style="margin:0;">${point.label}</h2>
                <p style="margin:5px 0;"><b>Total Orders:</b> ${areaOrders.length}</p>
            </div>

            <input type="text" 
                   id="tableSearch"
                   placeholder="🔍 Search orders..."
                   style="padding:8px 15px; width:250px;
                          border:1px solid #ccc;
                          border-radius:20px;">
        </div>
        <hr>
    `;

    if(areaOrders.length === 0){
        html += "<p>No orders in this area.</p>";
    } else {

       html += `
<div style="
    max-height:450px;
    overflow:auto;
    border-radius:14px;
    box-shadow:0 4px 18px rgba(0,0,0,0.08);
    border:1px solid #e5e7eb;
    background:white;
">

<table id="ordersTable" style="
    width:100%;
    border-collapse:collapse;
    font-size:14px;
">

<thead style="
    background:linear-gradient(to right,#1d3557,#457b9d);
    color:white;
    position:sticky;
    top:0;
    z-index:2;
">
<tr>
    <th style="padding:14px; text-align:left;">Order ID</th>
    <th style="padding:14px; text-align:left;">Customer</th>
    <th style="padding:14px; text-align:right;">Amount</th>
    <th style="padding:14px; text-align:center;">Status</th>
</tr>
</thead>

<tbody>
`;

areaOrders.forEach((o, index) => {

    var statusColor = "#6c757d";

    if(o.order_status.toLowerCase() === "confirmed")
        statusColor = "#16a34a";
    else if(o.order_status.toLowerCase() === "placed")
        statusColor = "#e9d903";
    else if(o.order_status.toLowerCase() === "preparing")
        statusColor = "#ff9800";
    else if(o.order_status.toLowerCase() === "out_for_delivery")
        statusColor = "#17a2b8";
    else if(o.order_status.toLowerCase() === "cancelled")
        statusColor = "#dc2626";
    else if(o.order_status.toLowerCase() === "delivered")
        statusColor = "#15803d";

    html += `
    <tr style="
        border-top:1px solid #f0f0f0;
        background:${index % 2 === 0 ? "#ffffff" : "#f9fafb"};
        transition:0.2s;
    "
    onmouseover="this.style.background='#eef2f7'"
    onmouseout="this.style.background='${index % 2 === 0 ? "#ffffff" : "#f9fafb"}'">

        <td style="padding:12px; font-weight:600;">
            ${o.id}
        </td>

        <td style="padding:12px;">
            ${o.customer_name}
        </td>

        <td style="
            padding:12px;
            text-align:right;
            font-weight:700;
            color:#2a9d8f;
        ">
            ₹${o.total_amount}
        </td>

        <td style="padding:12px; text-align:center;">
            <span style="
                padding:5px 14px;
                border-radius:20px;
                font-size:12px;
                font-weight:600;
                color:white;
                background:${statusColor};
            ">
                ${o.order_status}
            </span>
        </td>

    </tr>
    `;
});

html += `
</tbody>
</table>
</div>
`;}

    document.getElementById("modalContent").innerHTML = html;
    document.getElementById("orderModal").style.display = "flex";

    // 🔥 SEARCH WORKING
    var searchInput = document.getElementById("tableSearch");

    if(searchInput){
        searchInput.addEventListener("keyup", function() {
            var filter = this.value.toLowerCase();
            var rows = document.querySelectorAll("#ordersTable tbody tr");

            rows.forEach(function(row){
                var text = row.innerText.toLowerCase();
                row.style.display = text.includes(filter) ? "" : "none";
            });
        });
    }

    return false;
});

// ✅ CLOSE MODAL
document.getElementById("closeModal").onclick = function(){
    document.getElementById("orderModal").style.display = "none";
};

window.onclick = function(event){
    var modal = document.getElementById("orderModal");
    if(event.target == modal){
        modal.style.display = "none";
    }
};

</script>
{% endblock %}
