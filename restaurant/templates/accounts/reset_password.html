

<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>
    <style>
    body {
        background: linear-gradient(135deg, #f4f6f8, #e9eef3);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    .card {
        width: 380px;
        padding: 25px 50px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        animation: fadeIn 0.4s ease-in-out;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    h2 {
        text-align: center;
        margin-bottom: 20px;
    }

    input {
        width: 100%;
        padding: 12px;
        margin-top: 12px;
        border-radius: 8px;
        border: 2px solid #ddd;
        outline: none;
        transition: 0.3s;
    }

    input:focus {
        border-color: #2196f3;
        box-shadow: 0 0 6px rgba(33, 150, 243, 0.3);
    }

    button {
        width: 100%;
        padding: 12px;
        margin-top: 20px;
        background: #2196f3;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background: #1976d2;
    }

    ul {
        font-size: 13px;
        color: #666;
        margin-top: 15px;
        padding-left: 18px;
    }

    .msg {
        text-align: center;
        margin-bottom: 10px;
        font-size: 14px;
    }

    .error { color: red; }
    .success { color: green; }

</style>

</head>
<body>

<div class="card">
    <h2>Reset Password</h2>

    {% if messages %}
        {% for message in messages %}
            <div class="msg {{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST" action="{% url verify_url %}">
        {% csrf_token %}
        <input type="password" name="password" placeholder="New Password" required>
        <input type="password" name="confirm_password" placeholder="Confirm Password" required>

        <ul>
            <li>Minimum 8 characters</li>
            <li>At least 1 number</li>
            <li>At least 1 special character</li>
        </ul>

        <button type="submit">Reset Password</button>
    </form>
</div>

</body>
</html>
