


<!DOCTYPE html>
<html>
<head>
    <title>Verify OTP</title>
    <style>
    body {
        background: linear-gradient(135deg, #f4f6f8, #e9eef3);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    .card {
        width: 380px;
        padding: 30px 25px;
        background: white;
        border-radius: 12px;
        text-align: center;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        animation: fadeIn 0.4s ease-in-out;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    h2 {
        margin-bottom: 5px;
    }

    p {
        color: #666;
        font-size: 14px;
        margin-bottom: 20px;
    }

    .otp-box {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin: 20px 0;
    }

    .otp-input {
        width: 45px;
        height: 50px;
        font-size: 22px;
        text-align: center;
        border: 2px solid #ddd;
        border-radius: 8px;
        outline: none;
        transition: 0.3s;
    }

    .otp-input:focus {
        border-color: #4caf50;
        box-shadow: 0 0 5px rgba(76, 175, 80, 0.4);
    }

    button {
        width: 100%;
        padding: 12px;
        margin-top: 15px;
        background: #4caf50;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background: #43a047;
    }

    .error {
        color: red;
        font-size: 14px;
        margin-bottom: 10px;
    }

    #timer {
        font-size: 13px;
        color: #777;
        margin-top: 10px;
    }

    #resendBtn {
        margin-top: 10px;
        background: none;
        border: none;
        color: gray;
        font-size: 14px;
        cursor: pointer;
    }

    #resendBtn:enabled {
        color: #4caf50;
        font-weight: 500;
    }

</style>

</head>
<body>

<div class="card">
    <h2>Verify OTP</h2>
    <p>Enter the 6 digit OTP sent to your email</p>

    {% if messages %}
        {% for message in messages %}
            <div class="error">{{ message }}</div>
        {% endfor %}
    {% endif %}


    <form method="post" id="otpForm" action="{% url verify_url %}">
  {% csrf_token %}

  

  <div class="otp-box">
    <input type="text" maxlength="1" class="otp-input"
       inputmode="numeric" pattern="[0-9]*">
    <input type="text" maxlength="1" class="otp-input"
       inputmode="numeric" pattern="[0-9]*">
    <input type="text" maxlength="1" class="otp-input"
       inputmode="numeric" pattern="[0-9]*">
    <input type="text" maxlength="1" class="otp-input"
       inputmode="numeric" pattern="[0-9]*">
    <input type="text" maxlength="1" class="otp-input"
       inputmode="numeric" pattern="[0-9]*">
    <input type="text" maxlength="1" class="otp-input"
       inputmode="numeric" pattern="[0-9]*">

  </div>

  <!-- Hidden field (real OTP goes here) -->
  <input type="hidden" name="otp" id="otpValue">

  <button type="submit">Verify OTP</button>

 
<p id="timer"></p>

</form>
<form method="post" action="{% url 'resend_otp' %}">
{% csrf_token %}
<button type="submit" id="resendBtn" disabled style="color:gray">
Resend OTP
</button>
</form>



</div>

<script>
const inputs = document.querySelectorAll(".otp-input");
const hiddenOtp = document.getElementById("otpValue");

inputs.forEach((input, i) => {
  input.addEventListener("input", () => {
    input.value = input.value.replace(/[^0-9]/g, "");

    if (input.value && i < inputs.length - 1) {
      inputs[i + 1].focus();
    }

    hiddenOtp.value = [...inputs].map(i => i.value).join("");
  });
});
</script>

<script>
let timeLeft = 60;
const timer = document.getElementById("timer");
const resendBtn = document.getElementById("resendBtn");

const interval = setInterval(() => {
  timer.innerText = `Resend OTP in ${timeLeft}s`;
  timeLeft--;

  if (timeLeft < 0) {
    clearInterval(interval);
    timer.innerText = "You can resend OTP";
    resendBtn.disabled = false;
    resendBtn.style.color = "green";
  }
}, 1000);
</script>



</body>
</html>
