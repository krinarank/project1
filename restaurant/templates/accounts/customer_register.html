{% load static %}
<link rel="stylesheet" href="{% static 'accounts/customer_register.css' %}">

<div class="register-page">
  <div class="register-card">
    <h2>Customer Registration</h2>

    <form method="POST">
      {% csrf_token %}

    

      <!-- Username -->
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" value="{{ old.username|default:'' }}">
        <small class="error-text">{{ errors.username }}</small>
      </div>

      <!-- Firstname -->
      <div class="form-group">
        <label>First Name</label>
        <input type="text" name="firstname" value="{{ old.firstname|default:'' }}">
        <small class="error-text">{{ errors.firstname }}</small>
      </div>

      <!-- Lastname -->
      <div class="form-group">
        <label>Last Name</label>
        <input type="text" name="lastname" value="{{ old.lastname|default:'' }}">
        <small class="error-text">{{ errors.lastname }}</small>
      </div>

      <!-- Gender -->
      <div class="form-group">
        <label>Gender</label>
        <select name="gender">
          <option value="">Select Gender</option>
          <option value="Male" {% if old.gender == "Male" %}selected{% endif %}>Male</option>
          <option value="Female" {% if old.gender == "Female" %}selected{% endif %}>Female</option>
        </select>
        <small class="error-text">{{ errors.gender }}</small>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" value="{{ old.email|default:'' }}">
        <small class="error-text">{{ errors.email }}</small>
      </div>

      <!-- Contact -->
      <div class="form-group">
        <label>Contact Number</label>
        <input type="text" name="contactno" value="{{ old.contactno|default:'' }}">
        <small class="error-text">{{ errors.contactno }}</small>
      </div>

      <!-- Address -->
      <div class="form-group">
        <label>Address</label>
        <textarea name="address">{{ old.address|default:'' }}</textarea>
        <small class="error-text">{{ errors.address }}</small>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password">
        <small class="error-text">{{ errors.password }}</small>
      </div>

      <!-- Confirm Password -->
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" name="confirmpassword">
        <small class="error-text">{{ errors.confirmpassword }}</small>
      </div>

      <button type="submit" class="register-btn">
        Register
      </button>
    </form>

    <div class="login-link">
      Already have an account?
      <a href="{% url 'customer_login' %}">Login</a>
    </div>
  </div>
</div>
